# ==============================================================================
# ChargeGap India — Bayesian Network Prior Specification (config/bn_priors.yaml)
#
# NOTE ON HONESTY AND PROVENANCE:
# All parameters in this file are explicitly documented EXPERT ASSUMPTIONS derived
# from regulatory guidelines (CEA, NITI Aayog, MoP, BEE) or tagged as "analyst judgement".
# We strictly reject inventing pseudo-empirical probability tables from tiny samples.
# In accordance with institutional audit standards, every column sums to 1.0.
# ==============================================================================

version: "1.0.0"
date: "2026-11-03"
provenance_notice: "Expert prior parameters. Not fitted on synthetic data. Assumptions subject to Dirichlet sensitivity analysis."

nodes:
  Urbanisation:
    states: [low, med, high]
    parents: []
    rationale: "Baseline distribution of district urbanization tiers across Tamil Nadu and India."
    source: "Census of India / 2022 projections"
    cpt: [0.35, 0.40, 0.25]

  EV_growth:
    states: [low, med, high]
    parents: []
    rationale: "Compound annual growth rate tier distribution across administrative districts."
    source: "VAHAN Lok Sabha 2024-2026 registry trends"
    cpt: [0.30, 0.45, 0.25]

  Traffic_exposure:
    states: [low, med, high]
    parents: []
    rationale: "Exposure to inter-district highway corridor and freight transit flows."
    source: "MoRTH National Highway Network / analyst judgement"
    cpt: [0.35, 0.40, 0.25]

  OSM_completeness:
    states: [poor, fair, good]
    parents: []
    rationale: "Crowdsourced OpenStreetMap public charger data quality and confidence tier."
    source: "ChargeGap Phase 1 confidence score distribution"
    cpt: [0.40, 0.35, 0.25]

  Grid_headroom:
    states: [low, med, high, unknown]
    parents: []
    rationale: "Distribution substation spare capacity. 'unknown' represents unobserved grid telemetry."
    source: "CEA Discom Substation Reports / analyst judgement"
    cpt: [0.15, 0.25, 0.10, 0.50]

  Charging_behaviour:
    states: [home_dominant, mixed, public_dominant]
    parents: [Urbanisation]
    rationale: "Housing typology dictates availability of private residential overnight charging."
    source: "NITI Aayog EV Infrastructure Handbook 2021, Sec 2.1"
    cpt:
      "Urbanisation=low": [0.70, 0.25, 0.05]
      "Urbanisation=med": [0.40, 0.45, 0.15]
      "Urbanisation=high": [0.15, 0.40, 0.45]

  True_charger_supply:
    states: [low, med, high]
    parents: [OSM_completeness]
    rationale: "Actual charging supply is modulated by crowdsourced data completeness."
    source: "ChargeGap data audit / analyst judgement"
    cpt:
      "OSM_completeness=poor": [0.55, 0.30, 0.15]
      "OSM_completeness=fair": [0.40, 0.40, 0.20]
      "OSM_completeness=good": [0.30, 0.45, 0.25]

  Demand_ports:
    states: [low, med, high]
    parents: [EV_growth, Charging_behaviour, Traffic_exposure]
    rationale: "Port demand is driven by fleet growth rate, charging regime, and highway transit flow."
    source: "CEA / BEE EV Forecasting Model / analyst judgement"
    cpt:
      # EV_growth=low
      "EV_growth=low,Charging_behaviour=home_dominant,Traffic_exposure=low": [0.85, 0.12, 0.03]
      "EV_growth=low,Charging_behaviour=home_dominant,Traffic_exposure=med": [0.75, 0.20, 0.05]
      "EV_growth=low,Charging_behaviour=home_dominant,Traffic_exposure=high": [0.65, 0.25, 0.10]
      "EV_growth=low,Charging_behaviour=mixed,Traffic_exposure=low": [0.70, 0.25, 0.05]
      "EV_growth=low,Charging_behaviour=mixed,Traffic_exposure=med": [0.60, 0.30, 0.10]
      "EV_growth=low,Charging_behaviour=mixed,Traffic_exposure=high": [0.50, 0.35, 0.15]
      "EV_growth=low,Charging_behaviour=public_dominant,Traffic_exposure=low": [0.55, 0.35, 0.10]
      "EV_growth=low,Charging_behaviour=public_dominant,Traffic_exposure=med": [0.45, 0.40, 0.15]
      "EV_growth=low,Charging_behaviour=public_dominant,Traffic_exposure=high": [0.35, 0.45, 0.20]
      # EV_growth=med
      "EV_growth=med,Charging_behaviour=home_dominant,Traffic_exposure=low": [0.60, 0.32, 0.08]
      "EV_growth=med,Charging_behaviour=home_dominant,Traffic_exposure=med": [0.50, 0.40, 0.10]
      "EV_growth=med,Charging_behaviour=home_dominant,Traffic_exposure=high": [0.40, 0.45, 0.15]
      "EV_growth=med,Charging_behaviour=mixed,Traffic_exposure=low": [0.45, 0.42, 0.13]
      "EV_growth=med,Charging_behaviour=mixed,Traffic_exposure=med": [0.30, 0.50, 0.20]
      "EV_growth=med,Charging_behaviour=mixed,Traffic_exposure=high": [0.20, 0.55, 0.25]
      "EV_growth=med,Charging_behaviour=public_dominant,Traffic_exposure=low": [0.30, 0.50, 0.20]
      "EV_growth=med,Charging_behaviour=public_dominant,Traffic_exposure=med": [0.18, 0.52, 0.30]
      "EV_growth=med,Charging_behaviour=public_dominant,Traffic_exposure=high": [0.10, 0.45, 0.45]
      # EV_growth=high
      "EV_growth=high,Charging_behaviour=home_dominant,Traffic_exposure=low": [0.40, 0.45, 0.15]
      "EV_growth=high,Charging_behaviour=home_dominant,Traffic_exposure=med": [0.30, 0.48, 0.22]
      "EV_growth=high,Charging_behaviour=home_dominant,Traffic_exposure=high": [0.20, 0.50, 0.30]
      "EV_growth=high,Charging_behaviour=mixed,Traffic_exposure=low": [0.25, 0.50, 0.25]
      "EV_growth=high,Charging_behaviour=mixed,Traffic_exposure=med": [0.15, 0.50, 0.35]
      "EV_growth=high,Charging_behaviour=mixed,Traffic_exposure=high": [0.08, 0.42, 0.50]
      "EV_growth=high,Charging_behaviour=public_dominant,Traffic_exposure=low": [0.12, 0.48, 0.40]
      "EV_growth=high,Charging_behaviour=public_dominant,Traffic_exposure=med": [0.05, 0.35, 0.60]
      "EV_growth=high,Charging_behaviour=public_dominant,Traffic_exposure=high": [0.02, 0.18, 0.80]

  Requirement_class:
    states: [tier_1_low, tier_2_med, tier_3_high, tier_4_severe]
    parents: [Demand_ports, True_charger_supply]
    rationale: "Net public charging port requirements (<50, 50-200, 200-500, >500 ports) = Demand - Supply."
    source: "Phase 1 Sizing Benchmark / analyst judgement"
    cpt:
      "Demand_ports=low,True_charger_supply=low": [0.60, 0.30, 0.08, 0.02]
      "Demand_ports=low,True_charger_supply=med": [0.75, 0.20, 0.04, 0.01]
      "Demand_ports=low,True_charger_supply=high": [0.90, 0.08, 0.02, 0.00]
      "Demand_ports=med,True_charger_supply=low": [0.15, 0.55, 0.25, 0.05]
      "Demand_ports=med,True_charger_supply=med": [0.35, 0.50, 0.13, 0.02]
      "Demand_ports=med,True_charger_supply=high": [0.55, 0.38, 0.06, 0.01]
      "Demand_ports=high,True_charger_supply=low": [0.02, 0.13, 0.45, 0.40]
      "Demand_ports=high,True_charger_supply=med": [0.05, 0.25, 0.50, 0.20]
      "Demand_ports=high,True_charger_supply=high": [0.15, 0.45, 0.32, 0.08]

  Gap_class:
    states: [adequate, moderate, severe]
    parents: [Requirement_class, Grid_headroom]
    rationale: "Infrastructure deficit severity conditioned on port requirement tier and substation headroom."
    source: "MoP / Discom Feeder Constraints / analyst judgement"
    cpt:
      "Requirement_class=tier_1_low,Grid_headroom=low": [0.70, 0.25, 0.05]
      "Requirement_class=tier_1_low,Grid_headroom=med": [0.85, 0.12, 0.03]
      "Requirement_class=tier_1_low,Grid_headroom=high": [0.95, 0.04, 0.01]
      "Requirement_class=tier_1_low,Grid_headroom=unknown": [0.80, 0.16, 0.04]
      "Requirement_class=tier_2_med,Grid_headroom=low": [0.25, 0.55, 0.20]
      "Requirement_class=tier_2_med,Grid_headroom=med": [0.45, 0.45, 0.10]
      "Requirement_class=tier_2_med,Grid_headroom=high": [0.65, 0.30, 0.05]
      "Requirement_class=tier_2_med,Grid_headroom=unknown": [0.40, 0.45, 0.15]
      "Requirement_class=tier_3_high,Grid_headroom=low": [0.05, 0.35, 0.60]
      "Requirement_class=tier_3_high,Grid_headroom=med": [0.15, 0.55, 0.30]
      "Requirement_class=tier_3_high,Grid_headroom=high": [0.30, 0.55, 0.15]
      "Requirement_class=tier_3_high,Grid_headroom=unknown": [0.15, 0.45, 0.40]
      "Requirement_class=tier_4_severe,Grid_headroom=low": [0.01, 0.09, 0.90]
      "Requirement_class=tier_4_severe,Grid_headroom=med": [0.03, 0.27, 0.70]
      "Requirement_class=tier_4_severe,Grid_headroom=high": [0.08, 0.42, 0.50]
      "Requirement_class=tier_4_severe,Grid_headroom=unknown": [0.03, 0.22, 0.75]
